<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lets learn together — escolha um território</title>
  <meta name="description"
        content="Roadmaps de estudo em português, com prioridade, critério de conclusão e progresso salvo no navegador.">
  <link rel="stylesheet" href="inicio.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="logo/icon-192.png">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">

  <script>
    /* link antigo com ?trilha= aponta para o roadmap, não para cá.
       Vai antes de qualquer desenho, para não piscar a tela de escolha
       no caminho. */
    (function () {
      var achado = /[?&]trilha=([\w-]+)/.exec(window.location.search);
      if (achado) {
        window.location.replace("roadmap.html?trilha=" + achado[1]);
      }
    })();
  </script>
</head>
<body>

  <h1 class="marca">Lets learn together</h1>

  <!-- a mesa: as cartas em cima, o mascote de pé na frente delas -->
  <main class="mesa" id="mesa">
    <div class="cartas" id="cartas">
      <!-- preenchido por inicio.js, a partir do manifesto -->
    </div>

    <div class="ator" id="ator">
      <span class="ator__sombra"></span>
      <span class="ator__corpo">
        <svg viewBox="103 23 406 310" width="122" height="94" role="img"
             id="ator-svg" aria-label="O mascote, esperando">
          <g fill="var(--roxo)">
            <rect x="113" y="152" width="69" height="88" rx="34"/>
            <rect x="430" y="152" width="69" height="88" rx="34"/>
            <ellipse cx="306" cy="178" rx="165" ry="145"/>
          </g>
          <rect x="173" y="136" width="267" height="109" rx="54" fill="var(--amarelo)"/>
          <g fill="var(--roxo)" class="ator__cara" id="ator-cara">
            <ellipse class="ator__olho" cx="247" cy="186" rx="13" ry="16"/>
            <ellipse class="ator__olho" cx="364" cy="186" rx="13" ry="16"/>
            <path d="M292 201a14 14 0 0 0 28 0z"/>
          </g>
        </svg>
      </span>
    </div>
  </main>

  <div class="ficha">
    <p class="ficha__titulo" id="ficha-titulo">Escolha um território</p>
    <p class="ficha__linha" id="ficha-linha">
      Passe o ponteiro pelas cartas — o mascote vai junto.
    </p>
    <!-- o único lugar do site que avisa onde o progresso mora. Fica na
         linha onde o olho já está, e sai de cena quando você escolhe. -->
    <p class="ficha__aviso" id="ficha-aviso">
      Seu progresso fica salvo neste navegador.
    </p>
    <a id="ficha-partir" href="roadmap.html" hidden></a>
  </div>

  <!-- mesmo conteúdo do rodapé do roadmap, na linguagem da mesa:
       o cartucho de uma folha de levantamento, que é onde vão o autor
       e as observações da carta -->
  <footer class="rodape">
    <div class="rodape__linha">
      <p class="rodape__credito">
        <span class="rodape__label">Feito por</span>
        <a class="rodape__chip" href="https://github.com/masteryogo"
           target="_blank" rel="noopener noreferrer">@masteryogo</a>
      </p>
      <!-- o quadro é leitura, não ação: fica no botão simples, e o
           destaque continua só no Contribuir -->
      <a class="botao botao--destaque" id="contribuir"
         href="kanban.html"
         target="_blank" rel="noopener noreferrer">Contribuir</a>
    </div>
  </footer>

  <!-- SO_MANIFESTO impede o carregador de baixar uma trilha inteira:
       aqui só interessam os metadados de cada uma -->
  <script>window.SO_MANIFESTO = true;</script>
  <script src="trilhas.js"></script>
  <script src="inicio.js"></script>
</body>
</html>
