<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de sanfona</title>
<style>
  :root { color-scheme: light dark; --linha: #111; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem;
    font: 16px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #faf8f4; color: #111;
  }
  h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  .ajuda { margin: 0 0 1.5rem; font-size: 0.85rem; line-height: 1.5; }

  .caso { margin-bottom: 1.5rem; border: 2px solid var(--linha); background: #fff; }

  .faixa {
    display: flex; align-items: center; gap: 0.75rem;
    width: 100%; padding: 0; margin: 0;
    font: inherit; text-align: left;
    background: #ffd84d; color: #111;
    border: 0; border-bottom: 2px solid var(--linha);
    cursor: pointer;
  }
  .faixa b { flex: 1; padding: 0.75rem; font-weight: 400; }
  .faixa i {
    display: grid; place-items: center;
    width: 3rem; align-self: stretch;
    font-style: normal;
    border-left: 2px solid var(--linha);
    transition: transform 0.25s ease;
  }
  .caso[data-aberta="sim"] .faixa i { transform: rotate(180deg); }

  .veredito {
    padding: 0.5rem 0.75rem; font-size: 0.8rem;
    border-top: 2px dashed #bbb; background: #f4f2ee;
  }
  .veredito[data-ok="sim"] { background: #d6f5d6; }
  .veredito[data-ok="nao"] { background: #ffd6d6; }

  .topico { padding: 0.4rem 0.75rem; border-bottom: 1px solid #ddd; }

  /* ---------- A: exatamente como o site estava antes ---------- */
  #a .sanfona { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  #a[data-aberta="sim"] .sanfona { grid-template-rows: 1fr; }
  #a .grupos {
    columns: 3 17rem; column-gap: 2.5rem;
    min-height: 0; overflow: hidden;
    visibility: hidden; transition: visibility 0s linear 0.25s;
  }
  #a[data-aberta="sim"] .grupos { visibility: visible; transition-delay: 0s; }

  /* ---------- B: só troca 1fr por minmax(0, 1fr) ---------- */
  #b .sanfona { display: grid; grid-template-rows: minmax(0, 0fr); transition: grid-template-rows 0.25s ease; }
  #b[data-aberta="sim"] .sanfona { grid-template-rows: minmax(0, 1fr); }
  #b .grupos {
    columns: 3 17rem; column-gap: 2.5rem;
    min-height: 0; overflow: hidden;
    visibility: hidden; transition: visibility 0s linear 0.25s;
  }
  #b[data-aberta="sim"] .grupos { visibility: visible; transition-delay: 0s; }

  /* ---------- C: colunas num invólucro interno ---------- */
  #c .sanfona { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  #c[data-aberta="sim"] .sanfona { grid-template-rows: 1fr; }
  #c .grupos {
    min-height: 0; overflow: hidden;
    visibility: hidden; transition: visibility 0s linear 0.25s;
  }
  #c[data-aberta="sim"] .grupos { visibility: visible; transition-delay: 0s; }
  #c .colunas { columns: 3 17rem; column-gap: 2.5rem; }

  /* ---------- D: sem visibility ---------- */
  #d .sanfona { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s ease; }
  #d[data-aberta="sim"] .sanfona { grid-template-rows: 1fr; }
  #d .grupos { columns: 3 17rem; column-gap: 2.5rem; min-height: 0; overflow: hidden; }

  /* ---------- E: as três correções juntas (o que está no site agora) ---------- */
  #e .sanfona { display: grid; grid-template-rows: minmax(0, 0fr); transition: grid-template-rows 0.25s ease; }
  #e[data-aberta="sim"] .sanfona { grid-template-rows: minmax(0, 1fr); }
  #e .grupos {
    min-height: 0; overflow: hidden;
    visibility: hidden; transition: visibility 0s linear 0.25s;
  }
  #e[data-aberta="sim"] .grupos { visibility: visible; transition-delay: 0s; }
  #e .colunas { columns: 3 17rem; column-gap: 2.5rem; }

  @media (max-width: 600px) {
    #a .grupos, #b .grupos, #d .grupos,
    #c .colunas, #e .colunas { columns: 1; }
  }
</style>
</head>
<body>

<h1>Teste de sanfona</h1>
<p class="ajuda">
  Toque na setinha de cada faixa. A tarja de baixo diz sozinha se os tópicos
  apareceram. Me manda um print com as cinco abertas.
</p>

<div id="relatorio" class="ajuda"></div>

<script>
(function () {
  "use strict";

  var CASOS = [
    { id: "a", nome: "A — como estava antes", colunas: false },
    { id: "b", nome: "B — minmax(0, 1fr)",    colunas: false },
    { id: "c", nome: "C — colunas num invólucro", colunas: true },
    { id: "d", nome: "D — sem visibility",    colunas: false },
    { id: "e", nome: "E — as três juntas",    colunas: true }
  ];

  var TOPICOS = [
    "Variáveis e objetos", "Strings", "Listas", "Tuplas e conjuntos",
    "Dicionários", "Fluxo de controle", "Compreensões", "Funções",
    "Classes", "Laços e exceções", "I/O de arquivos", "Biblioteca padrão"
  ];

  function criar(caso) {
    var sec = document.createElement("section");
    sec.className = "caso";
    sec.id = caso.id;
    sec.setAttribute("data-aberta", "nao");

    var faixa = document.createElement("button");
    faixa.type = "button";
    faixa.className = "faixa";
    faixa.innerHTML = "<b>" + caso.nome + "</b><i>&#9660;</i>";

    var sanfona = document.createElement("div");
    sanfona.className = "sanfona";

    var grupos = document.createElement("div");
    grupos.className = "grupos";

    /* o alvo dos tópicos é o invólucro quando o caso tem um; é essa a
       única diferença estrutural entre as variantes */
    var alvo = grupos;
    if (caso.colunas) {
      alvo = document.createElement("div");
      alvo.className = "colunas";
      grupos.appendChild(alvo);
    }

    TOPICOS.forEach(function (t) {
      var d = document.createElement("div");
      d.className = "topico";
      d.textContent = "□ " + t;
      alvo.appendChild(d);
    });

    sanfona.appendChild(grupos);

    var veredito = document.createElement("div");
    veredito.className = "veredito";
    veredito.textContent = "fechado — toque na setinha";

    sec.appendChild(faixa);
    sec.appendChild(sanfona);
    sec.appendChild(veredito);

    faixa.addEventListener("click", function () {
      var abrir = sec.getAttribute("data-aberta") !== "sim";
      sec.setAttribute("data-aberta", abrir ? "sim" : "nao");

      /* mede depois da transição: medir no mesmo quadro devolve sempre
         zero, que é justamente o resultado que estamos investigando */
      window.setTimeout(function () { medir(caso, sec, veredito); }, 450);
    });

    return sec;
  }

  function medir(caso, sec, veredito) {
    var aberta = sec.getAttribute("data-aberta") === "sim";
    if (!aberta) {
      veredito.removeAttribute("data-ok");
      veredito.textContent = "fechado";
      return;
    }

    var sanfona = sec.querySelector(".sanfona");
    var alt = Math.round(sanfona.getBoundingClientRect().height);
    var ok = alt > 20;

    veredito.setAttribute("data-ok", ok ? "sim" : "nao");
    veredito.textContent = (ok ? "ABRIU" : "NÃO ABRIU") + " — altura " + alt + "px";
    relatar();
  }

  function relatar() {
    var linhas = [];
    CASOS.forEach(function (c) {
      var v = document.querySelector("#" + c.id + " .veredito");
      linhas.push(c.id.toUpperCase() + "=" + (v.getAttribute("data-ok") || "?"));
    });
    document.getElementById("relatorio").textContent =
      "Resumo: " + linhas.join("  ") + "  ·  " + navigator.userAgent;
  }

  CASOS.forEach(function (caso) {
    document.body.appendChild(criar(caso));
  });
  relatar();
})();
</script>

</body>
</html>
