<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notas de estudo</title>
  <link rel="stylesheet" href="obi.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="notas.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="logo/icon-192.png">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
</head>
<body class="notas-pagina">

  <!-- ============================ quina ============================ -->
  <!-- sem lixeira, como no calendário: aqui não há progresso para
       zerar, e apagar nota é por nota, dentro dela -->
  <div class="canto">
    <a class="botao botao--icone" href="index.html"
       title="Voltar para a escolha de trilha"
       aria-label="Voltar para a escolha de trilha">
      <!-- casa: telhado em degraus, duas paredes e o vão da porta -->
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <rect x="7" y="1" width="2" height="1"/>
        <rect x="6" y="2" width="4" height="1"/>
        <rect x="5" y="3" width="6" height="1"/>
        <rect x="4" y="4" width="8" height="1"/>
        <rect x="3" y="5" width="10" height="1"/>
        <rect x="2" y="6" width="12" height="1"/>
        <rect x="3" y="7" width="3" height="8"/>
        <rect x="10" y="7" width="3" height="8"/>
        <rect x="6" y="7" width="4" height="2"/>
      </svg>
    </a>

    <button id="btn-tema" class="botao botao--icone" type="button"
            title="Alternar entre tema claro e escuro"
            aria-label="Alternar entre tema claro e escuro">
      <!-- lua: disco em degraus com a mordida de um segundo disco -->
      <svg class="icone-lua" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="6" y="2" width="4" height="1"/>
        <rect x="5" y="3" width="4" height="1"/>
        <rect x="4" y="4" width="4" height="1"/>
        <rect x="3" y="5" width="4" height="1"/>
        <rect x="2" y="6" width="4" height="4"/>
        <rect x="3" y="10" width="4" height="1"/>
        <rect x="4" y="11" width="4" height="1"/>
        <rect x="5" y="12" width="4" height="1"/>
        <rect x="6" y="13" width="4" height="1"/>
      </svg>
      <!-- sol: núcleo quadrado e oito raios soltos -->
      <svg class="icone-sol" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5" y="5" width="6" height="6"/>
        <rect x="7" y="0" width="2" height="2"/>
        <rect x="7" y="14" width="2" height="2"/>
        <rect x="0" y="7" width="2" height="2"/>
        <rect x="14" y="7" width="2" height="2"/>
        <rect x="2" y="2" width="2" height="2"/>
        <rect x="12" y="2" width="2" height="2"/>
        <rect x="2" y="12" width="2" height="2"/>
        <rect x="12" y="12" width="2" height="2"/>
      </svg>
    </button>
  </div>

  <header class="cabecalho-notas">
    <h1 class="cabecalho-notas__titulo">Notas</h1>

    <!-- Um mural por trilha, sem aba "Todas": a nota é da trilha em
         que foi escrita, e um mural misturado não é de ninguém. Sem
         querystring, abre na última trilha visitada. -->
    <!-- As abas vêm do manifesto (trilhas.js), montadas por notas.js:
         trilha nova aparece aqui sem ninguém lembrar de editar esta
         página. Sem JS a navegação some, e o mural também — não há
         como escrever nota sem script. -->
    <nav class="filtro" id="filtro" aria-label="Escolher a trilha"></nav>
  </header>

  <div class="acoes-notas">
    <button class="botao botao--destaque" type="button" id="btn-nova">+ Nota</button>
    <span class="acoes-notas__conta" id="conta">3 notas</span>
  </div>

  <!-- ============================= mural ============================= -->
  <!-- A superfície é de pontos, não de cortiça: mesma ideia da malha
       milimetrada da carta na mesa — dá referência ao arrastar sem
       fingir uma textura que o resto do site não tem.

       Em tela larga cada nota é posicionada (left/top em linha); no
       celular o mural vira grade e `position: static` faz esses dois
       valores virarem letra morta, sem limpar nada no JS. -->
  <section class="mural" id="mural" aria-label="Mural de notas"></section>

  <!-- o gesto anunciado muda com o apontador, como a legenda do mapa -->
  <p class="dica-notas" id="dica">
    Arraste pela faixa de cima · ◆ marca a nota presa a um tópico
  </p>

  <!-- SO_MANIFESTO impede o carregador de baixar uma trilha inteira:
       aqui só interessam os metadados (rótulo e cor de cada trilha) -->
  <script>window.SO_MANIFESTO = true;</script>
  <script src="trilhas.js"></script>
  <script src="obi.js"></script>
  <script src="notas.js"></script>
</body>
</html>
