<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lets learn together — quadro de trabalho</title>
  <meta name="description"
        content="O que está em andamento, o que está bloqueado, o que está em análise e o que foi descartado — sempre com o motivo.">
  <link rel="stylesheet" href="kanban.css">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="logo/icon-192.png">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
</head>
<body>

  <header class="topo">
    <div class="topo__linha">
      <a class="botao" href="index.html">← Trilhas</a>
      <h1 class="marca">Quadro de trabalho</h1>
    </div>
    <p class="topo__nota">
      O que vem por aí, e o porquê de cada coisa estar onde está.
      Clique num card para ler o motivo inteiro.
    </p>
    <!-- os números não são enfeite: quase todo argumento do quadro
         ("50 marcações contra 353") se apoia neles -->
    <p class="topo__numeros" id="numeros"></p>
  </header>

  <!-- filtro por raia: o quadro inteiro cabe na tela, mas ler só
       "Interface" é a pergunta que mais se faz dele -->
  <nav class="raias" id="raias" aria-label="Filtrar por área"></nav>

  <main class="quadro" id="quadro">
    <!-- preenchido por kanban.js -->
  </main>

  <div class="veu" id="veu" hidden></div>

  <aside id="painel" class="painel" role="dialog" aria-modal="true"
         aria-labelledby="painel-titulo" hidden>
    <div class="painel__barra">
      <span id="painel-coluna" class="painel__coluna"></span>
      <button id="painel-fechar" class="botao botao--icone" type="button"
              aria-label="Fechar">×</button>
    </div>
    <div class="painel__corpo">
      <span id="painel-raia" class="etiqueta"></span>
      <h2 id="painel-titulo"></h2>
      <p id="painel-resumo" class="painel__resumo"></p>

      <!-- "por que" vem antes do detalhe, e com régua própria:
           é a única parte que todo card tem -->
      <section class="painel__secao painel__secao--regua">
        <h3>Por quê</h3>
        <p id="painel-porque" class="painel__nota"></p>
      </section>

      <div id="painel-blocos" class="painel__blocos"></div>

      <section class="painel__secao" id="painel-secao-veja" hidden>
        <h3>Veja também</h3>
        <div id="painel-veja" class="painel__veja"></div>
      </section>
    </div>
  </aside>

  <p class="aviso" id="aviso" role="status" aria-live="polite"></p>

  <script src="kanban-dados.js"></script>
  <script src="kanban.js"></script>
</body>
</html>
